# Run the CRM in Docker (no Vercel).
#   docker compose --env-file .env.local up -d --build app        # http://127.0.0.1:${APP_PORT:-3400}
# Production: https://ops.hard-code.in is an ingress rule on the host's `hardcode-prod` Cloudflare tunnel
# (~/.cloudflared/config.yml, systemd user service cloudflared.service) pointing at 127.0.0.1:3400.
# The `tunnel` profile below is only for a throwaway trycloudflare.com URL on a machine without that tunnel.
# The office internet path silently drops packets of 1492 bytes or more (measured 19 Nov 2026), which made every new
# TLS connection to Cloudflare-hosted services (Supabase included) stall for about 3.3 s. A bridge MTU of 1400 keeps
# the container's packets small enough to pass. Remove it only after the router's MTU / MSS clamping is fixed.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1400"

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env.local}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set in .env.local}
    image: hardcode-ops:latest
    container_name: hardcode-ops-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3400}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      # Set OPS_TIMING=1 to log one line per Supabase call and per page (scripts/timing-report.mjs summarises them).
      OPS_TIMING: ${OPS_TIMING:-}

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: hardcode-ops-tunnel
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: >
      tunnel --no-autoupdate ${CLOUDFLARE_TUNNEL_TOKEN:+run}
      ${CLOUDFLARE_TUNNEL_TOKEN:---url http://app:3000}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
